<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Product Data Center</title>
  <style>
    :root {
      --bg: #1A1A1A;
      --surface: #242424;
      --surface-hover: #2a2a2a;
      --border: #333333;
      --border-strong: #444444;
      --accent: #00C896;
      --accent-dim: rgba(0, 200, 150, 0.12);
      --text: #FFFFFF;
      --text-muted: #8f9895;
      --text-faint: #565f5c;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: dark; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0);
      background-size: 28px 28px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }

    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111111;
      color: var(--text);
      padding: 0.9rem 2rem;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }
    #contact-note {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      white-space: nowrap;
      margin-left: auto;
      letter-spacing: 0.02em;
    }

    main {
      max-width: 760px;
      margin: 0;
      padding: 3.5rem 2rem 2rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 46ch;
      animation-delay: 0s;
    }

    .divider {
      height: 1px;
      margin: 2rem 0;
      background: linear-gradient(90deg, var(--accent) 0%, var(--border) 32%, transparent 75%);
      animation-delay: 0.16s;
    }

    .system-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
      animation-delay: 0.2s;
    }

    .system-row {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      padding: 1.15rem 0.25rem;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      position: relative;
      border-left: 2px solid transparent;
      transition: border-left-color 0.15s, background 0.15s, padding-left 0.15s;
    }
    .system-row:hover,
    .system-row:focus-visible {
      background: var(--surface-hover);
      border-left-color: var(--accent);
      padding-left: 0.65rem;
    }
    .system-row:focus-visible { outline: none; }

    .system-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .system-name {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .system-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .system-arrow {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--text-faint);
      transition: transform 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .system-row:hover .system-arrow,
    .system-row:focus-visible .system-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    footer {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-faint);
      letter-spacing: 0.02em;
      margin: 3rem 2rem 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
        padding: 0.8rem 1rem;
      }
      #contact-note { margin-left: 0; white-space: normal; }
      main { padding: 2.5rem 1.25rem 1.5rem; }
      footer { margin: 2.5rem 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Product Data Center</h1>
    <span id="contact-note">維護：Ryan</span>
  </header>

  <main>
    <p class="subtitle reveal">選擇要進入的系統。</p>

    <div class="divider reveal"></div>

    <nav class="system-list reveal" aria-label="系統列表">
      <a class="system-row" href="Product-MasterData/">
        <span class="system-body">
          <span class="system-name">產品查詢系統</span>
          <span class="system-desc">每週一、四上午 9:00 更新</span>
        </span>
        <span class="system-arrow" aria-hidden="true">→</span>
      </a>

      <a class="system-row" href="ies-list/">
        <span class="system-body">
          <span class="system-name">IES 檔案清單</span>
          <span class="system-desc">每個工作日上午 8:50 更新</span>
        </span>
        <span class="system-arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>

  <footer>Product Data Center — 本資料僅供參考，使用上建議再次確認</footer>
</body>
</html>
