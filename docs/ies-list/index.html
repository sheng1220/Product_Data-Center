<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IES 檔案清單</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: #1A1A1A;
    color: #FFFFFF;
    font-size: 13px;
    line-height: 1.5;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #111111;
    padding: 0.9rem 2rem;
    border-bottom: 2px solid #00C896;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  header h1 { font-size: 1.3rem; font-weight: 600; color: #00C896; white-space: nowrap; }
  #data-date { font-size: 0.65rem; color: #888; white-space: nowrap; }
  #contact-note { font-size: 0.65rem; color: #FFFFFF; white-space: nowrap; margin-left: auto; }

  main { max-width: 100%; margin: 1.5rem auto; padding: 0 1rem; }

  .control-panel {
    background: #242424;
    border-radius: 8px;
    border: 1px solid #333;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  #filter-bar { display: flex; gap: 0.5rem; }
  #filter-input {
    flex: 1;
    padding: 0.55rem 0.8rem;
    font-size: 0.95rem;
    background: #1A1A1A;
    color: #FFFFFF;
    border: 1px solid #444;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  #filter-input::placeholder { color: #555; }
  #filter-input:focus { border-color: #00C896; box-shadow: 0 0 0 3px rgba(0,200,150,0.12); }

  #chip-container { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.6rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    background: #1A1A1A;
    border: 1px solid #444;
    color: #888;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: #666; }
  .chip.selected { background: rgba(0,200,150,0.12); border-color: #00C896; color: #00C896; }
  .chip.selected:hover { border-color: #33ddb0; }
  .chip-text { outline: none; min-width: 1ch; }
  .chip-edit { cursor: pointer; color: inherit; opacity: 0.55; font-size: 0.8rem; }
  .chip-edit:hover { opacity: 1; }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
    padding: 0 2px;
  }
  #result-count { font-size: 0.82rem; color: #666; }

  #download-selected-btn {
    background: #242424;
    color: #aaa;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 0.35rem 0.85rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
  }
  #download-selected-btn:hover:not(:disabled) { border-color: #00C896; color: #00C896; }
  #download-selected-btn:disabled { opacity: 0.4; cursor: default; }

  .select-col { width: 2.2rem; }
  td.select-cell { text-align: center; }

  .table-wrapper {
    max-height: 70vh;
    overflow: auto;
    border-radius: 8px;
    border: 1px solid #333;
  }
  table { width: 100%; border-collapse: collapse; background: #242424; }
  th {
    position: sticky;
    top: 0;
    background: #111111;
    padding: 0.65rem 0.85rem;
    text-align: left;
    font-size: 0.8rem;
    font-weight: 700;
    color: #00C896;
    border-bottom: 1px solid #333;
    letter-spacing: 0.03em;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: #33ddb0; }
  .sort-arrow { font-size: 0.65rem; margin-left: 2px; }
  td { padding: 0.55rem 0.85rem; border-bottom: 1px solid #2e2e2e; color: #FFFFFF; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #2a2a2a; }
  td a { color: #FFFFFF; text-decoration: underline; }
  td a:hover { color: #00C896; }

  #empty-message { text-align: center; color: #555; margin-top: 3rem; font-size: 0.95rem; }

  @media (max-width: 768px) {
    header { flex-direction: column; align-items: flex-start; gap: 0.25rem; padding: 0.8rem 1rem; }
    #data-date { white-space: normal; }
    #contact-note { margin-left: 0; white-space: normal; }
    .control-panel { padding: 1rem; gap: 0.75rem; }
  }
</style>
</head>
<body>
  <header>
    <h1>IES 檔案清單</h1>
    <span id="data-date">資料更新時間：2026-08-02 20:46</span>
    <span id="contact-note">系統維護：Ryan</span>
  </header>

  <main>
    <div class="control-panel">
      <div id="filter-bar">
        <input id="filter-input" type="search" placeholder="輸入完整品名，用空白分隔關鍵字" autocomplete="off">
      </div>
      <div id="chip-container"></div>
    </div>

    <div class="result-bar">
      <div id="result-count" aria-live="polite"></div>
      <button id="download-selected-btn" type="button" disabled>下載已選取 (0)</button>
    </div>

    <div class="table-wrapper">
      <table id="file-table" aria-label="IES 檔案清單">
        <thead>
          <tr>
            <th class="select-col"><input type="checkbox" id="select-all-checkbox" aria-label="全選"></th>
            <th data-field="filename">檔名<span class="sort-arrow"></span></th>
            <th data-field="path">資料夾路徑<span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="file-tbody"></tbody>
      </table>
    </div>

    <p id="empty-message" hidden>目前沒有符合條件的檔案。</p>
  </main>

<script>
const DATA = [];
let chips = [];
let sortField = 'filename';
let sortAsc = true;
let selectedLinks = new Set();
let lastFiltered = [];

const tbody = document.getElementById('file-tbody');
const emptyMsg = document.getElementById('empty-message');
const resultCount = document.getElementById('result-count');
const chipContainer = document.getElementById('chip-container');
const input = document.getElementById('filter-input');
const sortableHeaders = document.querySelectorAll('#file-table th[data-field]');
const selectAllCheckbox = document.getElementById('select-all-checkbox');
const downloadSelectedBtn = document.getElementById('download-selected-btn');

function renderChips() {
  chipContainer.innerHTML = '';
  chips.forEach((chip) => {
    const el = document.createElement('span');
    el.className = 'chip' + (chip.selected ? ' selected' : '');
    el.title = chip.selected ? '\u9EDE\u64CA\u4EE5\u53D6\u6D88\u9019\u500B\u95DC\u9375\u5B57' : '\u9EDE\u64CA\u4EE5\u5957\u7528\u9019\u500B\u95DC\u9375\u5B57';

    const text = document.createElement('span');
    text.className = 'chip-text';
    text.textContent = chip.text;
    text.addEventListener('input', () => {
      chip.text = text.textContent;
      renderTable();
    });
    text.addEventListener('blur', () => {
      text.contentEditable = 'false';
      chip.text = text.textContent.trim() || chip.text;
      renderChips();
      renderTable();
    });
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        text.blur();
      }
    });

    const editBtn = document.createElement('span');
    editBtn.className = 'chip-edit';
    editBtn.textContent = '\u270E';
    editBtn.title = '\u7DE8\u8F2F\u9019\u500B\u95DC\u9375\u5B57';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      text.contentEditable = 'true';
      text.focus();
      const range = document.createRange();
      range.selectNodeContents(text);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    el.addEventListener('click', () => {
      if (text.isContentEditable) return;
      chip.selected = !chip.selected;
      renderChips();
      renderTable();
    });

    el.appendChild(text);
    el.appendChild(editBtn);
    chipContainer.appendChild(el);
  });
}

function syncChipsFromInput() {
  const words = input.value.trim().split(/\s+/).filter(Boolean);
  const previousSelected = new Map(chips.map((c) => [c.text, c.selected]));
  chips = words.map((w) => ({
    text: w,
    selected: previousSelected.has(w) ? previousSelected.get(w) : true,
  }));
  renderChips();
  renderTable();
}

function updateSortArrows() {
  sortableHeaders.forEach((th) => {
    const arrow = th.querySelector('.sort-arrow');
    if (th.dataset.field === sortField) {
      arrow.textContent = sortAsc ? '\u25B2' : '\u25BC';
    } else {
      arrow.textContent = '';
    }
  });
}

function updateSelectionUI() {
  downloadSelectedBtn.textContent = `\u4e0b\u8f09\u5df2\u9078\u53d6 (${selectedLinks.size})`;
  downloadSelectedBtn.disabled = selectedLinks.size === 0;

  const visibleLinks = lastFiltered.map((item) => item.link);
  const allChecked = visibleLinks.length > 0 && visibleLinks.every((l) => selectedLinks.has(l));
  const someChecked = visibleLinks.some((l) => selectedLinks.has(l));
  selectAllCheckbox.checked = allChecked;
  selectAllCheckbox.indeterminate = !allChecked && someChecked;
}

function renderTable() {
  tbody.innerHTML = '';
  const activeChips = chips.filter((c) => c.selected && c.text);
  const filtered = DATA.filter((item) => {
    if (activeChips.length === 0) return true;
    const haystack = (item.filename + ' ' + item.path).toLowerCase();
    return activeChips.every((c) => haystack.includes(c.text.toLowerCase()));
  });

  filtered.sort((a, b) => {
    const av = a[sortField].toLowerCase();
    const bv = b[sortField].toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  updateSortArrows();
  lastFiltered = filtered;

  emptyMsg.hidden = filtered.length !== 0;
  resultCount.textContent = `\u5171 ${filtered.length} \u7b46`;

  filtered.forEach((item) => {
    const tr = document.createElement('tr');

    const tdCheck = document.createElement('td');
    tdCheck.className = 'select-cell';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = selectedLinks.has(item.link);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        selectedLinks.add(item.link);
      } else {
        selectedLinks.delete(item.link);
      }
      updateSelectionUI();
    });
    tdCheck.appendChild(checkbox);

    const tdName = document.createElement('td');
    tdName.textContent = item.filename;

    const tdPath = document.createElement('td');
    const a = document.createElement('a');
    a.href = item.link;
    a.textContent = item.path;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    tdPath.appendChild(a);

    tr.appendChild(tdCheck);
    tr.appendChild(tdName);
    tr.appendChild(tdPath);
    tbody.appendChild(tr);
  });

  updateSelectionUI();
}

input.addEventListener('input', syncChipsFromInput);
sortableHeaders.forEach((th) => {
  th.addEventListener('click', () => {
    const field = th.dataset.field;
    if (sortField === field) {
      sortAsc = !sortAsc;
    } else {
      sortField = field;
      sortAsc = true;
    }
    renderTable();
  });
});

selectAllCheckbox.addEventListener('change', () => {
  if (selectAllCheckbox.checked) {
    lastFiltered.forEach((item) => selectedLinks.add(item.link));
  } else {
    lastFiltered.forEach((item) => selectedLinks.delete(item.link));
  }
  renderTable();
});

downloadSelectedBtn.addEventListener('click', () => {
  selectedLinks.forEach((link) => {
    const a = document.createElement('a');
    a.href = link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
});

renderTable();
</script>
</body>
</html>
