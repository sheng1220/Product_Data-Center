    text.className = 'chip-text';
    text.textContent = chip.text;
    text.addEventListener('input', () => {
      chip.text = text.textContent;
      renderTable();
    });
    text.addEventListener('blur', () => {
      text.contentEditable = 'false';
      chip.text = text.textContent.trim() || chip.text;
      renderChips();
      renderTable();
    });
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        text.blur();
      }
    });

    const editBtn = document.createElement('span');
    editBtn.className = 'chip-edit';
    editBtn.textContent = '\u270E';
    editBtn.title = '\u7DE8\u8F2F\u9019\u500B\u95DC\u9375\u5B57';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      text.contentEditable = 'true';
      text.focus();
      const range = document.createRange();
      range.selectNodeContents(text);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });

    el.addEventListener('click', () => {
      if (text.isContentEditable) return;
      chip.selected = !chip.selected;
      renderChips();
      renderTable();
    });

    el.appendChild(text);
    el.appendChild(editBtn);
    chipContainer.appendChild(el);
  });
}

function syncChipsFromInput() {
  const words = input.value.trim().split(/\s+/).filter(Boolean);
  const previousSelected = new Map(chips.map((c) => [c.text, c.selected]));
  chips = words.map((w) => ({
    text: w,
    selected: previousSelected.has(w) ? previousSelected.get(w) : true,
  }));
  renderChips();
  renderTable();
}

function updateSortArrows() {
  sortableHeaders.forEach((th) => {
    const arrow = th.querySelector('.sort-arrow');
    if (th.dataset.field === sortField) {
      arrow.textContent = sortAsc ? '\u25B2' : '\u25BC';
    } else {
      arrow.textContent = '';
    }
  });
}

function updateSelectionUI() {
  downloadSelectedBtn.textContent = `\u4e0b\u8f09\u5df2\u9078\u53d6 (${selectedLinks.size})`;
  downloadSelectedBtn.disabled = selectedLinks.size === 0;

  const visibleLinks = lastFiltered.map((item) => item.link);
  const allChecked = visibleLinks.length > 0 && visibleLinks.every((l) => selectedLinks.has(l));
  const someChecked = visibleLinks.some((l) => selectedLinks.has(l));
  selectAllCheckbox.checked = allChecked;
  selectAllCheckbox.indeterminate = !allChecked && someChecked;
}

function renderTable() {
  tbody.innerHTML = '';
  const activeChips = chips.filter((c) => c.selected && c.text);
  const filtered = DATA.filter((item) => {
    if (activeChips.length === 0) return true;
    const haystack = (item.filename + ' ' + item.path).toLowerCase();
    return activeChips.every((c) => haystack.includes(c.text.toLowerCase()));
  });

  filtered.sort((a, b) => {
    const av = a[sortField].toLowerCase();
    const bv = b[sortField].toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  updateSortArrows();
  lastFiltered = filtered;

  emptyMsg.hidden = filtered.length !== 0;
  resultCount.textContent = `\u5171 ${filtered.length} \u7b46`;

  filtered.forEach((item) => {
    const tr = document.createElement('tr');

    const tdCheck = document.createElement('td');
    tdCheck.className = 'select-cell';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = selectedLinks.has(item.link);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        selectedLinks.add(item.link);
      } else {
        selectedLinks.delete(item.link);
      }
      updateSelectionUI();
    });
    tdCheck.appendChild(checkbox);

    const tdName = document.createElement('td');
    tdName.textContent = item.filename;

    const tdPath = document.createElement('td');
    const a = document.createElement('a');
    a.href = item.link;
    a.textContent = item.path;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    tdPath.appendChild(a);

    tr.appendChild(tdCheck);
    tr.appendChild(tdName);
    tr.appendChild(tdPath);
    tbody.appendChild(tr);
  });

  updateSelectionUI();
}

input.addEventListener('input', syncChipsFromInput);
sortableHeaders.forEach((th) => {
  th.addEventListener('click', () => {
    const field = th.dataset.field;
    if (sortField === field) {
      sortAsc = !sortAsc;
    } else {
      sortField = field;
      sortAsc = true;
    }
    renderTable();
  });
});

selectAllCheckbox.addEventListener('change', () => {
  if (selectAllCheckbox.checked) {
    lastFiltered.forEach((item) => selectedLinks.add(item.link));
  } else {
    lastFiltered.forEach((item) => selectedLinks.delete(item.link));
  }
  renderTable();
});

downloadSelectedBtn.addEventListener('click', () => {
  Array.from(selectedLinks).forEach((link, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 800);
  });
});

renderTable();
</script>
</body>
</html>
